---
# ===================================================================
# .cpanel.yml — ChemiCloud（cPanel）が配信サーバーを入れ替える手順
#
# SSH の口がこちらの IP に対して閉じているので、cPanel の
# Git Version Control を通り道にする。cPanel はこのファイルの
# tasks を、複製したリポジトリの中で、アカウントの権限で走らせる。
#
# 対象は server/ だけ。リポジトリにはサイト本体も入っているが、
# そちらは Xserver へ別に配っているので、ここでは触らない。
#
# 注意していること:
#   ・.env を消さない   本番の接続情報と鍵はここにしか無い。
#                       リポジトリには存在しないので、消すと
#                       次の再起動で上がらなくなる
#   ・node_modules を上書きしない
#                       CloudLinux の Node.js Selector は実体を
#                       ~/nodevenv/ 側に置き、アプリからは symlink で
#                       見せている。上から被せると Selector が壊れ、
#                       cPanel の画面からは直せなくなる
#   ・最後に必ず再起動   Passenger は動いているプロセスを抱えたまま
#                       なので、置いただけでは古いコードが応え続ける
# ===================================================================
deployment:
  tasks:
    # --- 送り先を確かめる ---------------------------------------
    # アプリがまだ作られていなければ、ここで止める。
    # 作らずに進むと、ファイルだけ置かれて動かない状態になり、
    # 「配置は成功、なぜか動かない」という一番読みにくい形になる。
    - export APP="$HOME/kstudy101-line"
    - test -d "$APP" || (echo "✗ $APP がありません。cPanel → Setup Node.js App でアプリを作ってください" && false)

    # --- コードを置く -------------------------------------------
    # .env と node_modules は --exclude で守る。--delete は付ける
    # ── 消したファイルが向こうに残ると、消したはずの古い経路が
    # 生き続ける。
    - /usr/bin/rsync -a --delete --exclude=node_modules --exclude=.env --exclude=.env.local server/ "$APP/"

    # --- 依存を入れて、入れ替える -------------------------------
    # activate の場所は Node の版でディレクトリ名が変わるので、
    # 決め打ちせずその都度探す。見つからなければ Selector が
    # アプリを作っていないということなので、そこで止める。
    - export ACT=$(ls -d "$HOME"/nodevenv/kstudy101-line/*/bin/activate 2>/dev/null | sort -V | tail -1)
    - test -n "$ACT" || (echo "✗ nodevenv が見つかりません。Setup Node.js App でアプリを作り直してください" && false)
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node -v; npm ci --omit=dev'
    - /bin/mkdir -p "$APP/tmp"
    - /bin/touch "$APP/tmp/restart.txt"
    - echo "✓ 配置と再起動要求まで終わりました"
