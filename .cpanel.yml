---
# ===================================================================
# .cpanel.yml — ChemiCloud（cPanel）が配信サーバーを入れ替える手順
#
# SSH の口がこちらの IP に対して閉じているので、cPanel の
# Git Version Control を通り道にする。cPanel はこのファイルの
# tasks を、複製したリポジトリの中で、アカウントの権限で走らせる。
# tasks は 1 つのシェルで続けて走るので、export はあとの行にも届く。
#
# 対象は server/ だけ。リポジトリにはサイト本体も入っているが、
# そちらは Xserver へ別に配っているので、ここでは触らない。
#
# 触ってはいけないものが 2 つ、送り先の中に同居している:
#   .env          本番の接続情報と鍵。リポジトリには無いので、
#                 消すと次の再起動で二度と上がらない
#   node_modules  CloudLinux の Node.js Selector は実体を
#                 ~/nodevenv/ 側に置き、アプリには symlink で見せる。
#                 上から被せると Selector が壊れ、cPanel の画面からは
#                 直せなくなる
# ===================================================================
deployment:
  tasks:
    - export APP="$HOME/kstudy101-line"
    - export SRC="$PWD/server"

    # --- 送り先を確かめる ---------------------------------------
    # アプリがまだ無いのに置くと、ファイルだけあって動かない状態に
    # なる。「配置は成功、なぜか動かない」は一番読みにくい失敗なので、
    # 進まずここで止める。
    - test -d "$APP" || (echo "NG - $APP がありません。cPanel の Setup Node.js App でアプリを作ってください" && false)

    # --- コードを置く -------------------------------------------
    # この共用サーバーに rsync は入っていない（初回の配置で 127 で
    # 落ちて分かった）。あるなら使い、無ければ「守るものを避けて
    # 消してから写す」で同じことをする。
    #
    # 消す手を残しているのは、消えたはずのファイルが向こうに残ると、
    # もう無いはずの経路が生き続けるため。
    - export RSYNC=$(command -v rsync || true)
    - if [ -n "$RSYNC" ]; then "$RSYNC" -a --delete --exclude=node_modules --exclude=.env --exclude=.env.local "$SRC/" "$APP/"; else find "$APP" -mindepth 1 -maxdepth 1 ! -name node_modules ! -name .env ! -name .env.local ! -name tmp ! -name public -exec rm -rf {} + && cp -a "$SRC/." "$APP/"; fi

    # --- 依存を入れる -------------------------------------------
    # activate の場所は Node の版でディレクトリ名が変わる。決め打ちに
    # せず毎回探す。10 と 24 が並んでいるので sort -V で新しい方を取る
    # （辞書順だと 24 より 10 が後ろに来る）。
    - export ACT=$(ls -d "$HOME"/nodevenv/kstudy101-line/*/bin/activate 2>/dev/null | sort -V | tail -1)
    - test -n "$ACT" || (echo "NG - nodevenv がありません。Setup Node.js App を確認してください" && false)
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; echo "node $(node -v) / npm $(npm -v)"; npm ci --omit=dev'

    # --- 表を code に合わせる -----------------------------------
    # migrate は「エラーが出なかった」で終わらず、表が 8 つ本当にあるか・
    # utf8mb4 か・接続の time_zone が +09:00 かを数え直す。何度流しても
    # 同じ結果になるので、配置のたびに通す。
    #
    # 再起動より前に置く。ここで落ちたら古いコードが動き続ける ──
    # 新しいコードが古い表に向かって動き出すより、そのほうが安全。
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/migrate.mjs'

    # --- 入れ替える ---------------------------------------------
    # Passenger は動いているプロセスを抱えたままなので、置いただけでは
    # 古いコードが応え続ける。restart.txt に触れて初めて入れ替わる。
    - /bin/mkdir -p "$APP/tmp"
    - /bin/touch "$APP/tmp/restart.txt"
    - echo "OK - 配置と再起動要求まで終わりました"
