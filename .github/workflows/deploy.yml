name: Deploy to Xserver

# main に push すると Xserver へ同期する。
# 手動実行（workflow_dispatch）では dry_run を選べるので、
# 初回や設定変更後は必ずそちらで内容を確認してから本番へ流すこと。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'data/**'
      - 'docs/**'   # 計画書などの内部文書。build-site.sh の PUBLIC に無く配信もされない
      # tools/ は除外しない。build-site.sh が dist の中身を決めるので、
      # ここを直したのにデプロイされない、という食い違いが起きる。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '転送せず、送る予定のファイルだけ表示する'
        type: boolean
        default: false

concurrency:
  group: deploy-xserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v4 は Node.js 20 を指していて、ランナーが Node 24 へ載せ替えたうえで
      # 警告を出していた。動いてはいるが、いずれ動かなくなる。
      #
      # v5 以降はどれも node24 なので警告は消える。最新の v7 にしたのは、
      # ここが checkout に入力を 1 つも渡していないため ── メジャー間の
      # 変更が当たる面が無く、v5 に留めても近いうちに同じ作業をするだけ。
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------
      # 四柱の計算を公表値（国立天文台）と突き合わせる。
      #
      # 節気の時刻と日柱の基準日は、ずれていても「それらしい干支」が出る。
      # 画面を見ても気づけないので、機械に見張らせる。基準は
      # data/naoj-reference.json に入れてあるので通信は要らない。
      # ---------------------------------------------------------------
      - name: Verify saju
        run: node tools/verify-saju.mjs

      # ---------------------------------------------------------------
      # 運勢の点数。こちらは突き合わせる公表値が無いので、約束したこと
      # （決定論・項目間の公平・保存物に生年月日が入らない）を確かめる。
      # ---------------------------------------------------------------
      - name: Verify fortune
        run: node tools/verify-fortune.mjs

      # ---------------------------------------------------------------
      # 単語帳・出席・助詞。保存が絡むので、消せること・黙って失敗しない
      # ことまで見る。助詞はパッチムで形が変わるので、間違えると
      # 学習コンテンツとして誤りを教えることになる。
      # ---------------------------------------------------------------
      - name: Verify study
        run: node tools/verify-study.mjs

      # ---------------------------------------------------------------
      # 名前の変換。STEP 1 そのもので、このサイトの土台。
      # かな → ハングルの規則は README に表で書いてあるので、
      # 文書のとおりに動くかを文書の例でそのまま確かめる。漢字音は
      # 手書き 222 字を kanji.json と突き合わせる。
      # ---------------------------------------------------------------
      - name: Verify name
        run: node tools/verify-name.mjs

      # ---------------------------------------------------------------
      # おみくじ。運勢と違って乱数を使うので、確かめることも逆になる ──
      # 「引くたびに変わるか」と「同じ日に引き直せないか」。
      # ---------------------------------------------------------------
      - name: Verify omikuji
        run: node tools/verify-omikuji.mjs

      # ---------------------------------------------------------------
      # 方位。土台になる朔（新月）がずれると손없는 날が丸ごとずれるので、
      # そこを国立天文台の公表値と突き合わせる。
      # ---------------------------------------------------------------
      - name: Verify gilbang
        run: node tools/verify-gilbang.mjs

      # ---------------------------------------------------------------
      # 부적。ここは占いと違って数値が無いので、確かめるのは「書いてある
      # ことが正しいか」── 中央に置いた漢字の韓国音を kanji.json の
      # 2,136 字と突き合わせる。読みが違えば、飾りではなく教材の誤りになる。
      # ---------------------------------------------------------------
      - name: Verify amulet
        run: node tools/verify-amulet.mjs

      # ---------------------------------------------------------------
      # 生年月日の持ち回り。トップで入れた値を /gilbang と /amulet が
      # 読むので、置き場所が sessionStorage であること自体が
      # privacy.html の約束になっている。localStorage に書き換えても
      # 画面は何も変わらないので、人間のレビューでは通ってしまう。
      # ---------------------------------------------------------------
      - name: Verify birth
        run: node tools/verify-birth.mjs

      # ---------------------------------------------------------------
      # ページの構造・メタ・リンク。他の 6 つが「計算が合っているか」を
      # 見るのに対し、こちらは 9 ページを横に並べて食い違いを探す。
      # ページが増えるほど、増えた 1 枚だけ何かが抜ける確率が上がる。
      # ---------------------------------------------------------------
      - name: Verify pages
        run: node tools/verify-pages.mjs

      # ---------------------------------------------------------------
      # LINE 配信システム（server/）の土台。
      #
      # ここは Xserver へは送らない ── 動くのは ChemiCloud で、
      # dist にも入らない（build-site.sh の PUBLIC は許可リスト）。
      # それでもこの関門に並べるのは、見張っている中身が
      # 「動かしても気づけないもの」だから:
      #
      #   ・日付の境目。サーバーの時計が UTC だと朝 7 時の配信で
      #     「今日もう送ったか」が毎朝外れ、二重に届く
      #   ・決済の再送。同じ取引が二度届いたときに保有日数を
      #     二度足していないか（請求は通っているので気づけない）
      #   ・配信バッチの二重起動。同じ日を二度送っていないか
      #
      # DB は要らない。repo/ は渡された接続の execute() しか使わない
      # 約束なので、偽物を渡して SQL を読む。npm install も要らない
      # （mysql2 を読むのは server/lib/db.mjs だけ）── その約束が
      # 守られているかも、この検証自身が見ている。
      # ---------------------------------------------------------------
      - name: Verify server
        run: node tools/verify-server.mjs

      # ---------------------------------------------------------------
      # LINE Webhook の受け口（P2）。
      #
      # webhook の URL は公開されていて誰でも POST できるので、
      # 署名の確認がシステム全体の境界になる。ここが緩むと
      # 「友だち追加されました」も「クイズに正解しました」も
      # 他人が名乗れるが、画面上は正常にしか見えない。
      #
      #   ・生のバイト列で計算しているか（JSON を組み直していないか）
      #   ・timingSafeEqual か（=== だと何文字目で違うかが時間に出る）
      #   ・署名を確かめる前に本文を解釈していないか
      #   ・postback の data から正答を読んでいないか
      #     （data は利用者の端末を通って戻るので、書き換えれば必ず正解になる）
      #
      # 最後のものは、押した人にも運営者にも「正解しました」としか
      # 見えない。動かして見つかる類いではないので機械に見張らせる。
      # ---------------------------------------------------------------
      - name: Verify webhook
        run: node tools/verify-webhook.mjs

      # ---------------------------------------------------------------
      # ウェブの占い結果を LINE アカウントへ繋ぐところ（P3）。
      #
      # OAuth は間違えても画面上は成功に見えるものが多い。
      #
      #   ・state が推測できると、他人の四柱データを自分の LINE へ
      #     付け替えられる。ここは randomBytes(32) と、DB へは
      #     ハッシュで置くこと・1 回しか使えないことを見る
      #   ・Login と Messaging API のチャネルが別プロバイダーだと
      #     userId が別物になり、登録は成功して配信だけが永久に届かない。
      #     リンク完了時に Messaging API 側へ問い合わせて気づけるように
      #     してあるので、その問い合わせが残っているかを見る
      #   ・生年月日を受ける口なので、CORS を * にしていないか
      #   ・利用者が入れた名前を、そのまま HTML に出していないか
      #   ・"1995-04-12T23:00:00Z" を日付として受け取らないか
      #     （UTC の夜は JST では翌日。黙って切ると日柱が 1 日ずれる）
      # ---------------------------------------------------------------
      - name: Verify onboarding
        run: node tools/verify-onboarding.mjs

      # ---------------------------------------------------------------
      # 原稿を実際に送る文面へ組み立てるところ（P4-a）。
      #
      # 韓国語の助詞は直前の文字にパッチムがあるかで形が変わる。
      # 「켄은」と「켄는」は、韓国語を知らない読み手には同じに見えるので、
      # 間違えても誰も報告してこない ── 毎朝 101 日ぶん、間違った
      # 韓国語を教え続けることになる。
      #
      # サイト本体（index.html）の規則を実ソースから読んで突き合わせる。
      # 別々に持つと、同じ名前がウェブと LINE で違う助詞になる。
      # ---------------------------------------------------------------
      - name: Verify render
        run: node tools/verify-render.mjs

      # ---------------------------------------------------------------
      # 朝の配信バッチ（P4-b）。
      #
      # ここの誤りは全部「送った記録だけは正常に残る」形で出るので、
      # 動かして気づける類いではない:
      #
      #   ・確保する前に送る   → 送信成功・確保失敗の日に、翌朝もう一度
      #   ・原稿の無い日で確保 → 誰も読まないまま 1 日が消える
      #   ・二重起動を防げない → 同じ日が二度、次の日が誰にも
      #   ・保有日数を見ない   → 払っていない人に配り続ける
      #
      # DB も LINE も要らない。偽の接続を渡して SQL の順番を読み、
      # 偽の送信関数が呼ばれた瞬間に DB が何をされていたかを覗く。
      # 「送る前に日が確保されているか」は、本物へ送っても見えない。
      # ---------------------------------------------------------------
      - name: Verify push batch
        run: node tools/verify-push.mjs

      # ---------------------------------------------------------------
      # 公開ファイルを dist/ に集める。
      # このプロジェクトにビルドツールは無い（package.json も無い）。
      # それでも dist を作るのは、リポジトリにはあるが公開しては
      # いけないもの（data/kanji_platform.db、tools/、README.md）を
      # 落とすため。
      # ---------------------------------------------------------------
      - name: Build dist
        run: bash tools/build-site.sh

      # ---------------------------------------------------------------
      # 検証。壊れたものを本番へ送らないための関門。
      # ---------------------------------------------------------------
      - name: Verify
        env:
          SITE_HOST: ${{ vars.SITE_HOST || 'www.kstudy101.jp' }}
        run: |
          set -uo pipefail
          fail=0

          host=$(grep -o 'rel="canonical" href="https://[^/"]*' dist/index.html | sed 's|.*https://||')
          echo "公開ホスト: $host（期待: $SITE_HOST）"
          [ "$host" = "$SITE_HOST" ] || { echo "✗ canonical のホストが想定と違います"; fail=1; }

          # 外部サービスのURLが壊れていないか。
          # 一括置換でここを壊したことがあるので、毎回確かめる。
          for f in dist/index.html dist/privacy.html dist/contact.html dist/tips.html; do
            grep -q 'pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js' "$f" \
              || { echo "✗ $f: AdSense の src が壊れています"; fail=1; }
            grep -q 'www\.googletagmanager\.com/gtag/js' "$f" \
              || { echo "✗ $f: GA の src が壊れています"; fail=1; }
          done

          # 拡張子なしURLの受け皿。これが無いと /privacy 等が全部 404 になる。
          grep -q 'REQUEST_FILENAME}.html -f' dist/.htaccess \
            || { echo "✗ .htaccess に拡張子なしURLの書き換えがありません"; fail=1; }

          # 共用 JS は名前に版が無いので、毎回確認させる指定が要る。
          # 本番のヘッダはあとのスモークテストで見るが、送る前に気づきたい。
          grep -qE 'FilesMatch "\\\.\(html\|js\|css\)\$"' dist/.htaccess \
            || { echo "✗ .htaccess で .js/.css が no-cache になっていません"; fail=1; }

          if find dist \( -name '*.db' -o -name '*.py' -o -name '*.sh' \) | grep -q .; then
            echo "✗ 非公開ファイルが dist にあります"; fail=1
          fi

          exit $fail

      - name: Show planned upload (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          echo "転送予定:"
          find dist -type f | sed 's|^dist/|  |' | sort
          echo
          echo "合計 $(find dist -type f | wc -l) ファイル / $(du -sh dist | cut -f1)"

      # ---------------------------------------------------------------
      # SSH 鍵。Xserver の SSH はポート 10022。
      # サーバーパネルで SSH 設定を ON にし、公開鍵を登録しておくこと。
      # ---------------------------------------------------------------
      - name: Set up SSH
        if: ${{ !inputs.dry_run }}
        env:
          KEY:  ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          DEST: ${{ secrets.XSERVER_PATH }}
          PORT: ${{ secrets.XSERVER_PORT }}
        run: |
          set -uo pipefail

          # 何が足りないのかを最初にはっきり出す。
          # 未設定のまま進むと ssh-keyscan や chmod が謎のエラーで落ち、
          # 原因の切り分けに時間を取られる。
          # 変数名と Secret 名は一致していないので、対応表で出す。
          # ここを取り違えると「登録したのに未設定と言われる」ことになる。
          miss=0
          check_secret () {   # $1=環境変数名 $2=Secret名
            local val="${!1:-}"
            if [ -z "$val" ]; then
              echo "✗ $2 が空です"
              miss=1
            else
              echo "✓ $2 設定あり（${#val} 文字）"
            fi
          }
          check_secret HOST XSERVER_HOST
          check_secret USER XSERVER_USER
          check_secret DEST XSERVER_PATH
          check_secret KEY  XSERVER_SSH_KEY

          if [ "$miss" -ne 0 ]; then
            echo
            echo "登録先を間違えていないか確認してください。"
            echo "  このワークフローが動いているリポジトリ: ${{ github.repository }}"
            echo "  → そのリポジトリの Settings → Secrets and variables → Actions"
            echo "    → 「Secrets」タブ（Variables タブではありません）"
            echo
            echo "必要な Secret 名（完全一致・大文字）:"
            echo "  XSERVER_HOST     例) svXXXX.xserver.jp"
            echo "  XSERVER_USER     サーバーID"
            echo "  XSERVER_PATH     例) /home/<ID>/kstudy101.jp/public_html"
            echo "  XSERVER_SSH_KEY  秘密鍵の全文（-----BEGIN ... END----- を含む）"
            echo "  XSERVER_PORT     10022（省略可）"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 公開鍵を貼ってしまう取り違えが多いので形を見る
          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/id_ed25519; then
            echo "✗ XSERVER_SSH_KEY が秘密鍵ではありません"
            if grep -q '^ssh-\(rsa\|ed25519\)' ~/.ssh/id_ed25519; then
              echo "  → 公開鍵（ssh-rsa AAAA... で始まるもの）が入っています。"
            fi
            echo
            echo "  鍵は2つあり、置く場所が逆になっています:"
            echo "    秘密鍵（-----BEGIN ... PRIVATE KEY-----）"
            echo "      → GitHub Secret の XSERVER_SSH_KEY"
            echo "        Actions は「自分が誰か」を証明する側なので秘密鍵が要ります"
            echo "    公開鍵（ssh-rsa AAAA...）"
            echo "      → Xserver サーバーパネル → SSH設定 → 公開鍵登録"
            echo
            echo "  XSERVER_SSH_KEY には秘密鍵ファイルの中身を、"
            echo "  BEGIN 行から END 行まで改行ごと貼り直してください。"
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1 \
            || { echo "✗ 秘密鍵を読めません。改行が失われているか、パスフレーズ付きです"; exit 1; }
          echo "✓ 秘密鍵の形式 OK"

          echo "ホスト鍵を取得中: $HOST:${PORT:-10022}"
          ssh-keyscan -p "${PORT:-10022}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "✗ $HOST:${PORT:-10022} からホスト鍵を取得できません"
            echo "  ホスト名の誤り、またはサーバーパネルで SSH 設定が OFF の可能性"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "✓ ホスト鍵取得"

          # 接続設定を1か所にまとめ、guard と rsync から共用する。
          #
          # ssh-rsa（SHA-1）の明示許可は入れていない。詳細ログで確認したところ
          # サーバーは rsa-sha2-512 を提示しており、既定のまま鍵交換も認証も
          # 通っている。不要な互換オプションは、将来の OpenSSH で
          # 「Bad configuration option」になって別の障害を生むだけ。
          cat > ~/.ssh/config <<CONF
          Host deploy
            HostName $HOST
            User $USER
            Port ${PORT:-10022}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
          CONF
          sed -i 's/^          //' ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "接続確認中…"
          if out=$(ssh deploy 'echo ok' 2>&1); then
            echo "✓ SSH 接続成功"
          else
            echo "✗ SSH 接続に失敗しました"
            echo "--- ssh の出力 ---"
            echo "$out" | sed 's/^/  /'
            echo "------------------"
            # 「Connection closed by」は鍵の拒否（Permission denied）とは別物で、
            # 認証まで進む前に切られている。どこで切れたかは -vvv でしか分からない。
            echo "--- 詳細ログ（どの段階で切れたか）---"
            ssh -vvv deploy 'echo ok' 2>&1 \
              | grep -E 'Connecting|Remote protocol|kex|host key|Authentications that can continue|Offering|Trying private key|Server accepts key|Authenticated|closed|banner|debug1: (Next|No more)' \
              | head -30 | sed 's/^/  /'
            echo "------------------------------------"
            echo "確認する点:"
            echo "  ・公開鍵（.pub）がサーバーパネルに登録されているか"
            echo "  ・その公開鍵が XSERVER_SSH_KEY の秘密鍵と対になっているか"
            echo "  ・XSERVER_USER がサーバーIDと一致しているか"
            echo
            echo "▼ この秘密鍵に対応する公開鍵です。"
            echo "  これを Xserver サーバーパネル → SSH設定 → 公開鍵登録 に"
            echo "  登録されている値と見比べてください。"
            echo "  （この値を XSERVER_SSH_KEY に入れるのではありません。"
            echo "    Secret に入れるのは秘密鍵のままです）"
            ssh-keygen -y -f ~/.ssh/id_ed25519 2>/dev/null | sed 's/^/  /'
            exit 1
          fi

      # ---------------------------------------------------------------
      # 転送先の安全確認。
      #
      # 以前このドメインには WordPress サイトが入っていた（現在は撤去済み）。
      # --delete を伴う同期を別サイトの上へ流すと、そのサイトを丸ごと消す。
      # 一度その構成のまま実行しかけたので、転送先を毎回確かめてから送る。
      # ---------------------------------------------------------------
      - name: Guard destination
        if: ${{ !inputs.dry_run }}
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          PORT: ${{ secrets.XSERVER_PORT }}
          DEST: ${{ secrets.XSERVER_PATH }}
        run: |
          set -euo pipefail
          SSH="ssh deploy"   # ~/.ssh/config の設定（RSA 互換込み）を使う

          echo "転送先: $DEST"
          $SSH "test -d '$DEST'" || { echo "✗ 転送先が存在しません"; exit 1; }

          # WordPress など別サイトが入っていないか
          for f in wp-config.php wp-load.php wp-content wp-includes; do
            if $SSH "test -e '$DEST/$f'"; then
              echo "✗ 転送先に $f があります。別のサイトが動いています。"
              echo "  --delete でそのサイトを消してしまうため中止します。"
              echo "  サブドメイン用の public_html を XSERVER_PATH に設定してください。"
              exit 1
            fi
          done

          # 見覚えのないファイルが多数ある場合も止める
          # （初回は空 or index.html のみのはず）
          n=$($SSH "ls -A '$DEST' 2>/dev/null | wc -l")
          known=$($SSH "ls -A '$DEST' 2>/dev/null" | grep -cE '^(index|privacy|contact|tips|404)\.html$|^(page\.css|kanji\.json|ogp\.png|ads\.txt|robots\.txt|sitemap\.xml|\.htaccess|default_page\.png)$' || true)
          if [ "$n" -gt 2 ] && [ "$known" -eq 0 ]; then
            echo "✗ 転送先に想定外のファイルが $n 件あります。中止します。"
            $SSH "ls -A '$DEST'" | sed 's/^/    /'
            exit 1
          fi
          echo "✓ 転送先は空か、このサイトのファイルのみです（$n 件）"

      # ---------------------------------------------------------------
      # 同期。--delete でサーバー側の余分なファイルも消える。
      # .htaccess も転送対象（rsync はドット始まりも送る）。
      # ---------------------------------------------------------------
      - name: Deploy (rsync over SSH)
        if: ${{ !inputs.dry_run }}
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          PORT: ${{ secrets.XSERVER_PORT }}
          DEST: ${{ secrets.XSERVER_PATH }}
        run: |
          rsync -rlvz --delete --checksum -e ssh dist/ "deploy:$DEST/"

      # ---------------------------------------------------------------
      # 公開後の実地確認。本番の設定ミスを拾う最後の網。
      # ---------------------------------------------------------------
      - name: Smoke test
        if: ${{ !inputs.dry_run }}
        env:
          SITE_HOST: ${{ vars.SITE_HOST || 'www.kstudy101.jp' }}
        run: |
          set -uo pipefail
          BASE="https://$SITE_HOST"
          sleep 5
          fail=0

          check () {
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$BASE$1" || echo 000)
            if [ "$code" = "$2" ]; then echo "  ✓ $1 → $code"
            else echo "  ✗ $1 → $code（期待 $2）"; fail=1; fi
          }

          echo "拡張子なしURL（Apache は既定で解決しない。移行の要）"
          for p in / /privacy /contact /tips /words /omikuji /gilbang /amulet; do check "$p" 200; done

          echo "実ファイル"
          for p in /kanji.json /ogp.png /ads.txt /sitemap.xml /robots.txt; do check "$p" 200; done

          echo "運勢が使う実ファイル（PUBLIC への追加漏れはここで出る）"
          for p in /saju.js /fortune.js /study.js /omikuji.js /gilbang.js /amulet.js \
                   /solar-terms.json /new-moons.json; do check "$p" 200; done

          echo "存在しないURLは 404（SPA フォールバックを入れていない確認）"
          check /no-such-page 404

          echo "非公開ファイルが見えていないこと"
          for p in /kanji_platform.db /data/kanji_platform.db /tools/build-site.sh /README.md; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$p" || echo 000)
            if [ "$code" = "200" ]; then echo "  ✗ $p が公開されています"; fail=1
            else echo "  ✓ $p → $code"; fi
          done

          # curl | grep -q は使わない。grep -q は一致した時点でパイプを閉じるため
          # curl が SIGPIPE で 141 終了し、pipefail がそれを拾って
          # 「一致したのに失敗」になる。本文を変数に取ってから調べる。
          echo "ads.txt の中身（200 だけ見ても中身が欠けていれば広告は止まる）"
          body=$(curl -s --max-time 20 "$BASE/ads.txt" || true)
          case "$body" in
            *pub-1754834273377558*) echo "  ✓ パブリッシャーIDを確認" ;;
            *) echo "  ✗ ads.txt にパブリッシャーIDがありません"; fail=1 ;;
          esac

          # 共用ファイルは build-site.sh が ?v=<内容ハッシュ> を付けている。
          # 見るべきは「HTML が実際に呼んでいるURL」で、素のパスではない。
          #
          # Xserver は Apache の前に nginx を置いていて、そこがURL単位で
          # 応答を抱える。素のパスは古い写しが残り続けることがあるが、
          # 中身が変われば ?v= が変わるので利用者には新しい方が届く。
          echo "HTML が呼んでいる共用ファイル（?v= 付き）"
          home=$(curl -s --max-time 20 "$BASE/")
          refs=$(printf '%s' "$home" | grep -oE '(href|src)="/?[a-z-]+\.(css|js)\?v=[0-9a-f]+"' \
                 | sed 's/.*="//;s/"$//' | sort -u)
          if [ -z "$refs" ]; then
            echo "  ✗ ?v= 付きの参照が1つも見つかりません（版付けが効いていません）"; fail=1
          fi
          for p in $refs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/${p#/}" || echo 000)
            if [ "$code" = "200" ]; then echo "  ✓ $p → 200"
            else echo "  ✗ $p → $code"; fail=1; fi
          done

          # .htaccess の no-cache 指定そのものは、nginx の写しを避けて確かめる。
          # 版付けがあるので実害は無いが、設定が壊れたことには気づきたい。
          echo ".htaccess の no-cache 指定（nginx の写しを迂回して確認）"
          for p in /page.css /fortune.js; do
            cc=$(curl -sI --max-time 20 "$BASE$p?cb=$RANDOM$$" | tr -d '\r' \
                 | grep -i '^cache-control:' | cut -d' ' -f2- || true)
            case "$cc" in
              *no-cache*) echo "  ✓ $p → $cc" ;;
              *) echo "  ✗ $p の Cache-Control が「$cc」です（no-cache が要ります）"; fail=1 ;;
            esac
          done

          echo "www の向き（ここがループすると全ページ落ちる）"
          apex=${SITE_HOST#www.}
          hops=$(curl -s -o /dev/null -L --max-redirs 5 -w '%{num_redirects}' \
                   --max-time 20 "https://$apex/tips" || echo 99)
          if [ "$hops" -le 1 ]; then
            echo "  ✓ apex → www は $hops 回で収束"
          else
            echo "  ✗ apex から $hops 回リダイレクト。サーバー設定と .htaccess が"
            echo "    逆向きを向いている可能性があります"; fail=1
          fi
          hops2=$(curl -s -o /dev/null -L --max-redirs 5 -w '%{num_redirects}' \
                    --max-time 20 "$BASE/tips" || echo 99)
          if [ "$hops2" -eq 0 ]; then
            echo "  ✓ www は転送なしで応答"
          else
            echo "  ✗ www からさらに $hops2 回転送されています"; fail=1
          fi

          echo "内容の反映"
          home=$(curl -s --max-time 20 "$BASE/" || true)
          case "$home" in
            *"rel=\"canonical\" href=\"https://$SITE_HOST/\""*)
              echo "  ✓ canonical 反映済み" ;;
            *)
              echo "  ✗ canonical が想定と違います"
              echo "$home" | grep -o '<link rel="canonical"[^>]*>' | sed 's/^/    /'
              fail=1 ;;
          esac

          exit $fail
