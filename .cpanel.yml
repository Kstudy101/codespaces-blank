---
# ===================================================================
# .cpanel.yml — ChemiCloud（cPanel）が配信サーバーを入れ替える手順
#
# SSH の口がこちらの IP に対して閉じているので、cPanel の
# Git Version Control を通り道にする。cPanel はこのファイルの
# tasks を、複製したリポジトリの中で、アカウントの権限で走らせる。
# tasks は 1 つのシェルで続けて走るので、export はあとの行にも届く。
#
# 対象は server/ だけ。リポジトリにはサイト本体も入っているが、
# そちらは Xserver へ別に配っているので、ここでは触らない。
#
# 触ってはいけないものが 3 つ、送り先の中に同居している:
#   .env          本番の接続情報と鍵。リポジトリには無いので、
#                 消すと次の再起動で二度と上がらない
#   node_modules  CloudLinux の Node.js Selector は実体を
#                 ~/nodevenv/ 側に置き、アプリには symlink で見せる。
#                 上から被せると Selector が壊れ、cPanel の画面からは
#                 直せなくなる
#   content       101 日ぶんの原稿。公開リポジトリに置いていないので
#                 サーバーのここにしか無い。消すと配信が止まり、
#                 手元から上げ直すまで戻らない
#   stderr.log    アプリが落ちた理由。消していたので、配置するたびに
#                 「配置前に何が起きていたか」が消えていた ── 調べたい
#                 のはたいてい配置の直前なので、いちばん要るものを
#                 いちばん要るときに捨てていた
# ===================================================================
deployment:
  tasks:
    - export APP="$HOME/kstudy101-line"
    - export SRC="$PWD/server"

    # --- 送り先を確かめる ---------------------------------------
    # アプリがまだ無いのに置くと、ファイルだけあって動かない状態に
    # なる。「配置は成功、なぜか動かない」は一番読みにくい失敗なので、
    # 進まずここで止める。
    - test -d "$APP" || (echo "NG - $APP がありません。cPanel の Setup Node.js App でアプリを作ってください" && false)

    # --- コードを置く -------------------------------------------
    # この共用サーバーに rsync は入っていない（初回の配置で 127 で
    # 落ちて分かった）。あるなら使い、無ければ「守るものを避けて
    # 消してから写す」で同じことをする。
    #
    # 消す手を残しているのは、消えたはずのファイルが向こうに残ると、
    # もう無いはずの経路が生き続けるため。
    - export RSYNC=$(command -v rsync || true)
    # 除外は 2 つの分岐で必ず同じにする。rsync 側に tmp と public が
    # 抜けていた ── どちらも Passenger のもので、消えるとアプリが
    # 上がらなくなりうる。今この環境に rsync は無いので現に走るのは
    # find 側だけだが、入った日に静かに目を覚ます種類の食い違いになる。
    - if [ -n "$RSYNC" ]; then "$RSYNC" -a --delete --exclude=node_modules --exclude=.env --exclude=.env.local --exclude=content --exclude=tmp --exclude=public --exclude=stderr.log "$SRC/" "$APP/"; else find "$APP" -mindepth 1 -maxdepth 1 ! -name node_modules ! -name .env ! -name .env.local ! -name content ! -name tmp ! -name public ! -name stderr.log -exec rm -rf {} + && cp -a "$SRC/." "$APP/"; fi

    # --- 運勢エンジンを写す -------------------------------------
    # saju.js / fortune.js / solar-terms.json はサイト本体のもので、
    # リポジトリに 1 部しか無い。server/ に複製を置くと、直したつもりが
    # 片方だけになり、ウェブと LINE で違う運勢が出る ── どちらも
    # それらしい数字を出すので、並べて見るまで気づけない。
    # 配置のたびに、その 1 部から写す。
    - /bin/mkdir -p "$APP/engine"
    - /bin/cp -f "$PWD/saju.js" "$PWD/fortune.js" "$PWD/solar-terms.json" "$APP/engine/"

    # --- 依存を入れる -------------------------------------------
    # activate の場所は Node の版でディレクトリ名が変わる。決め打ちに
    # せず毎回探す。10 と 24 が並んでいるので sort -V で新しい方を取る
    # （辞書順だと 24 より 10 が後ろに来る）。
    - export ACT=$(ls -d "$HOME"/nodevenv/kstudy101-line/*/bin/activate 2>/dev/null | sort -V | tail -1)
    - test -n "$ACT" || (echo "NG - nodevenv がありません。Setup Node.js App を確認してください" && false)
    #
    # ci ではなく install。ci は node_modules を消して作り直すが、ここで
    # 消えるのは Selector の symlink（実体は ~/nodevenv/ 側）で、1 度でも
    # 走ると仮想環境との繋がりが切れる。切れると cPanel の画面が
    # 「node_modules という名前の実体を置くな」と言って npm を拒むので、
    # 画面からは直せない ── File Manager で消して Restart するまで戻らない。
    # activate を通すだけでは防げない。activate が決めるのはどの npm を
    # 使うかで、ci が消すこと自体は止まらない。
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; echo "node $(node -v) / npm $(npm -v)"; npm install --omit=dev'

    # --- 表を code に合わせる -----------------------------------
    # migrate は「エラーが出なかった」で終わらず、表が 8 つ本当にあるか・
    # utf8mb4 か・接続の time_zone が +09:00 かを数え直す。何度流しても
    # 同じ結果になるので、配置のたびに通す。
    #
    # 再起動より前に置く。ここで落ちたら古いコードが動き続ける ──
    # 新しいコードが古い表に向かって動き出すより、そのほうが安全。
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/migrate.mjs'

    # --- 原稿を入れ直す -----------------------------------------
    # content/ があるときだけ。upsertTemplate は何度流しても同じ
    # 結果になるので、配置のたびに通してよい。
    #
    # seed 側が全部検査してから 1 件目を入れる。20 日目で落ちて
    # 19 日ぶんだけ入った状態が残る、が起きない。
    - if [ -d "$APP/content" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/seed-content.mjs'; else echo "原稿がまだありません（content/ なし）"; fi

    # --- 頼まれたときだけ、実物で一周する -----------------------
    # smoke は決済の再送・バッチの二重起動・退会の連鎖削除まで実際に
    # 書いて消す。専用の試験用 1 件しか触らず前後で消すので本番でも
    # 流せるが、配置のたびに書き込む理由は無い。
    #
    # ~/.run-smoke を置いた回だけ走り、走ったら自分で消す。
    # 置くのは Fileman API から ── SSH が無くても合図を送れる。
    - if [ -f "$HOME/.run-smoke" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/smoke.mjs' && /bin/rm -f "$HOME/.run-smoke"; else echo "smoke は流しません（~/.run-smoke がありません）"; fi

    # --- 頼まれたときだけ、対象の状態を見る ---------------------
    - if [ -f "$HOME/.run-who" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/who.mjs' && /bin/rm -f "$HOME/.run-who"; else echo "対象の確認はしません"; fi

    # --- 頼まれたときだけ、配信の下見をする ---------------------
    # --dry-run は誰にも送らない。対象を引いて、原稿を組み立てて、
    # 何日目が誰へ行くかを数えるところまでで止まる。
    #
    # 送らないのに流す意味は、本番の DB と本番の原稿を通したときに
    # だけ出る不具合があるため ── 手元の偽の接続では、SQL の形は
    # 見られても、実際の列や文字コードまでは分からない。
    #
    # cron が呼ぶのと同じ push-cron.sh を通す。直接 push-daily.mjs を
    # 呼ぶと、cron の道（activate を探すところ）だけが試されない。
    - if [ -f "$HOME/.run-push-dry" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; bash db/push-cron.sh --dry-run' && /bin/rm -f "$HOME/.run-push-dry"; else echo "配信の下見はしません（~/.run-push-dry がありません）"; fi

    # --- cron の 3 行を確かめる ---------------------------------
    # morning / evening / maintain は、cron の行が無いと永久に走らない。
    # 実際、2026-08-05 の配置ログの crontab -l 実測で morning / evening が
    # **無かった**（文書には 08-04 に画面から登録済みと記録されていたのに、
    # crontab には maintain しか居なかった）── 登録を人の記憶と画面操作に
    # 置かない。配置のたびに 3 行の有無を見て、**無いものだけ**足す。
    # 既存の行には触らない（mode 名の grep で行単位に守る）。
    #
    # morning / evening が毎時なのは設計どおり ── 何時に送るかは各バッチが
    # 日本時間を見て決める（--not-before=7 / 18。借りたサーバーの地方時は
    # 移設・夏時間で黙ってずれるため。db/push-cron.sh の頭書き）。
    # maintain だけ 19:00 UTC = 04:00 JST 固定 ── 届く時刻の約束が無く、
    # 消すのは期限切れと 400 日前のログだけなので、ずれても配信と
    # 表を取り合わない。
    - for spec in "0 * * * *:morning" "0 * * * *:evening" "0 19 * * *:maintain"; do mode="${spec##*:}"; sched="${spec%:*}"; line="$sched /bin/bash ~/kstudy101-line/db/push-cron.sh $mode >> ~/logs/push.log 2>&1"; if crontab -l 2>/dev/null | /bin/grep -qF "push-cron.sh $mode"; then echo "OK - $mode の cron は登録済み"; else ( crontab -l 2>/dev/null; echo "$line" ) | crontab - && echo "OK - $mode の cron を登録しました（$sched）" || echo "NG - $mode を crontab に登録できません。cPanel の Cron Jobs で手で追加してください → $line"; fi; done
    # いま cron に何が居るかを配置ログへ（登録の成否を後から読めるように）。
    - crontab -l 2>/dev/null | /bin/grep -F "push-cron.sh" || echo "（push-cron の行が 1 本もありません）"

    # --- 保守の道を下見する（読むだけ）---------------------------
    # cron が通るのと同じ道（push-cron.sh maintain）を --dry-run で
    # 1 度通す。1 行も消さない ── 期限切れが何件たまっているか・
    # 台帳のずれが配置ログに残り、cron の行が初めて動く前に
    # 道の破れに気づける。配信の下見（.run-push-dry）と同じ考え方
    # だが、こちらは読むだけなので毎回でよい。
    - /bin/bash "$APP/db/push-cron.sh" maintain --dry-run

    # --- 入れ替える ---------------------------------------------
    # Passenger は動いているプロセスを抱えたままなので、置いただけでは
    # 古いコードが応え続ける。restart.txt に触れて初めて入れ替わる。
    - /bin/mkdir -p "$APP/tmp"
    - /bin/touch "$APP/tmp/restart.txt"
    - echo "OK - 配置と再起動要求まで終わりました"
