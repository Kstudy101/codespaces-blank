---
# ===================================================================
# .cpanel.yml — ChemiCloud（cPanel）が配信サーバーを入れ替える手順
#
# SSH の口がこちらの IP に対して閉じているので、cPanel の
# Git Version Control を通り道にする。cPanel はこのファイルの
# tasks を、複製したリポジトリの中で、アカウントの権限で走らせる。
# tasks は 1 つのシェルで続けて走るので、export はあとの行にも届く。
#
# 対象は server/ だけ。リポジトリにはサイト本体も入っているが、
# そちらは Xserver へ別に配っているので、ここでは触らない。
#
# 触ってはいけないものが 3 つ、送り先の中に同居している:
#   .env          本番の接続情報と鍵。リポジトリには無いので、
#                 消すと次の再起動で二度と上がらない
#   node_modules  CloudLinux の Node.js Selector は実体を
#                 ~/nodevenv/ 側に置き、アプリには symlink で見せる。
#                 上から被せると Selector が壊れ、cPanel の画面からは
#                 直せなくなる
#   content       101 日ぶんの原稿。公開リポジトリに置いていないので
#                 サーバーのここにしか無い。消すと配信が止まり、
#                 手元から上げ直すまで戻らない
#   stderr.log    アプリが落ちた理由。消していたので、配置するたびに
#                 「配置前に何が起きていたか」が消えていた ── 調べたい
#                 のはたいてい配置の直前なので、いちばん要るものを
#                 いちばん要るときに捨てていた
# ===================================================================
deployment:
  tasks:
    - export APP="$HOME/kstudy101-line"
    - export SRC="$PWD/server"

    # --- 送り先を確かめる ---------------------------------------
    # アプリがまだ無いのに置くと、ファイルだけあって動かない状態に
    # なる。「配置は成功、なぜか動かない」は一番読みにくい失敗なので、
    # 進まずここで止める。
    - test -d "$APP" || (echo "NG - $APP がありません。cPanel の Setup Node.js App でアプリを作ってください" && false)

    # --- コードを置く -------------------------------------------
    # この共用サーバーに rsync は入っていない（初回の配置で 127 で
    # 落ちて分かった）。あるなら使い、無ければ「守るものを避けて
    # 消してから写す」で同じことをする。
    #
    # 消す手を残しているのは、消えたはずのファイルが向こうに残ると、
    # もう無いはずの経路が生き続けるため。
    - export RSYNC=$(command -v rsync || true)
    - if [ -n "$RSYNC" ]; then "$RSYNC" -a --delete --exclude=node_modules --exclude=.env --exclude=.env.local --exclude=content --exclude=stderr.log "$SRC/" "$APP/"; else find "$APP" -mindepth 1 -maxdepth 1 ! -name node_modules ! -name .env ! -name .env.local ! -name content ! -name tmp ! -name public ! -name stderr.log -exec rm -rf {} + && cp -a "$SRC/." "$APP/"; fi

    # --- 依存を入れる -------------------------------------------
    # activate の場所は Node の版でディレクトリ名が変わる。決め打ちに
    # せず毎回探す。10 と 24 が並んでいるので sort -V で新しい方を取る
    # （辞書順だと 24 より 10 が後ろに来る）。
    - export ACT=$(ls -d "$HOME"/nodevenv/kstudy101-line/*/bin/activate 2>/dev/null | sort -V | tail -1)
    - test -n "$ACT" || (echo "NG - nodevenv がありません。Setup Node.js App を確認してください" && false)
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; echo "node $(node -v) / npm $(npm -v)"; npm ci --omit=dev'

    # --- 表を code に合わせる -----------------------------------
    # migrate は「エラーが出なかった」で終わらず、表が 8 つ本当にあるか・
    # utf8mb4 か・接続の time_zone が +09:00 かを数え直す。何度流しても
    # 同じ結果になるので、配置のたびに通す。
    #
    # 再起動より前に置く。ここで落ちたら古いコードが動き続ける ──
    # 新しいコードが古い表に向かって動き出すより、そのほうが安全。
    - /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/migrate.mjs'

    # --- 原稿を入れ直す -----------------------------------------
    # content/ があるときだけ。upsertTemplate は何度流しても同じ
    # 結果になるので、配置のたびに通してよい。
    #
    # seed 側が全部検査してから 1 件目を入れる。20 日目で落ちて
    # 19 日ぶんだけ入った状態が残る、が起きない。
    - if [ -d "$APP/content" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/seed-content.mjs'; else echo "原稿がまだありません（content/ なし）"; fi

    # --- 頼まれたときだけ、実物で一周する -----------------------
    # smoke は決済の再送・バッチの二重起動・退会の連鎖削除まで実際に
    # 書いて消す。専用の試験用 1 件しか触らず前後で消すので本番でも
    # 流せるが、配置のたびに書き込む理由は無い。
    #
    # ~/.run-smoke を置いた回だけ走り、走ったら自分で消す。
    # 置くのは Fileman API から ── SSH が無くても合図を送れる。
    - if [ -f "$HOME/.run-smoke" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; node db/with-env.mjs db/smoke.mjs' && /bin/rm -f "$HOME/.run-smoke"; else echo "smoke は流しません（~/.run-smoke がありません）"; fi

    # --- 頼まれたときだけ、配信の下見をする ---------------------
    # --dry-run は誰にも送らない。対象を引いて、原稿を組み立てて、
    # 何日目が誰へ行くかを数えるところまでで止まる。
    #
    # 送らないのに流す意味は、本番の DB と本番の原稿を通したときに
    # だけ出る不具合があるため ── 手元の偽の接続では、SQL の形は
    # 見られても、実際の列や文字コードまでは分からない。
    #
    # cron が呼ぶのと同じ push-cron.sh を通す。直接 push-daily.mjs を
    # 呼ぶと、cron の道（activate を探すところ）だけが試されない。
    - if [ -f "$HOME/.run-push-dry" ]; then /bin/bash -lc 'set -e; . "$ACT"; cd "$APP"; bash db/push-cron.sh --dry-run' && /bin/rm -f "$HOME/.run-push-dry"; else echo "配信の下見はしません（~/.run-push-dry がありません）"; fi

    # --- 入れ替える ---------------------------------------------
    # Passenger は動いているプロセスを抱えたままなので、置いただけでは
    # 古いコードが応え続ける。restart.txt に触れて初めて入れ替わる。
    - /bin/mkdir -p "$APP/tmp"
    - /bin/touch "$APP/tmp/restart.txt"
    - echo "OK - 配置と再起動要求まで終わりました"
